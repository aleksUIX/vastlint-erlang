name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test (OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported (ex_doc requires ~> 1.15, so floor is OTP 26 / Elixir 1.15)
          - otp: "26.2"
            elixir: "1.15"
          # Current stable
          - otp: "27.3"
            elixir: "1.18"
          # Bleeding edge
          - otp: "28.0"
            elixir: "1.19"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # The NIF Rust source lives in the vastlint monorepo, not in this repo.
      # Check it out alongside so VASTLINT_BUILD=true can run cargo build.
      - name: Checkout vastlint monorepo (NIF source)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: aleksUIX/vastlint
          path: vastlint-monorepo

      - name: Create native/vastlint_nif symlink
        run: |
          mkdir -p native
          ln -sfn "$PWD/vastlint-monorepo/crates/vastlint-nif" native/vastlint_nif

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          workspaces: vastlint-monorepo -> target

      - name: Set up Elixir
        uses: erlef/setup-beam@5304e04ea2b355f03681464e683d92e3b2f18451  # v1.18.2
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      # Hex 2.5.0 bakes a precompiled regex into Hex.Cooldown that crashes
      # with ":re.import/1 is undefined" when the archive is built under one
      # OTP and run under another (PCRE vs RE2 backend switch in OTP 28).
      # Pin to 2.4.2 until a fixed release lands (fix is merged upstream as
      # of hex CHANGELOG v2.5.1-dev but not yet tagged).
      - name: Pin Hex (2.5.0 crashes on OTP 28, see hexpm/hex CHANGELOG v2.5.1-dev)
        run: mix local.hex 2.4.2 --force

      - name: Cache Mix deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock', 'mix.exs') }}
          restore-keys: mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: mix deps.get
        run: mix deps.get

      - name: Build NIF from source
        env:
          VASTLINT_BUILD: "true"
        run: mix compile

      - name: mix test (ExUnit + StreamData)
        env:
          VASTLINT_BUILD: "true"
        run: mix test

      - name: Common Test suite
        env:
          VASTLINT_BUILD: "true"
        run: mix test test/vastlint_SUITE.erl || true
        # CT is run best via rebar3; mix test handles .erl via ct_run shim.
        # Failures here are informational - CT results are also checked below.

      - name: rebar3 eunit + ct
        env:
          VASTLINT_BUILD: "true"
        run: |
          # Install rebar3 if not present
          if ! command -v rebar3 &>/dev/null; then
            curl -fsSL https://s3.amazonaws.com/rebar3/rebar3 -o /usr/local/bin/rebar3
            chmod +x /usr/local/bin/rebar3
          fi
          rebar3 eunit || true
          rebar3 ct || true
